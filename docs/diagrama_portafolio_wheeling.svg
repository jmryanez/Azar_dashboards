<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="800" letter-spacing="1">SISTEMA DE COBERTURA WHEELING ORTOGONAL (5 JUGADAS)</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Optimización de Bloques Steiner para Maximizar la Captura de Premios en Dinero</text>

  <!-- Pool de Entrada -->
  <rect x="40" y="105" width="250" height="330" rx="12" fill="#090d16" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="165" y="135" text-anchor="middle" fill="#60a5fa" font-family="Inter, sans-serif" font-size="14" font-weight="700">POOL BAYESIANO (18 Bolitas)</text>
  <text x="165" y="155" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Filtrado KDE Hazard + Grafo</text>

  <!-- Bolitas del Pool -->
  <g fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
    <circle cx="80" cy="200" r="18"/><text x="80" y="204" fill="#ffffff">02</text>
    <circle cx="135" cy="200" r="18"/><text x="135" y="204" fill="#ffffff">09</text>
    <circle cx="190" cy="200" r="18"/><text x="190" y="204" fill="#ffffff">11</text>
    <circle cx="245" cy="200" r="18"/><text x="245" y="204" fill="#ffffff">12</text>

    <circle cx="80" cy="250" r="18"/><text x="80" y="254" fill="#ffffff">14</text>
    <circle cx="135" cy="250" r="18"/><text x="135" y="254" fill="#ffffff">15</text>
    <circle cx="190" cy="250" r="18"/><text x="190" y="254" fill="#ffffff">16</text>
    <circle cx="245" cy="250" r="18"/><text x="245" y="254" fill="#ffffff">22</text>

    <circle cx="80" cy="300" r="18"/><text x="80" y="304" fill="#ffffff">25</text>
    <circle cx="135" cy="300" r="18"/><text x="135" y="304" fill="#ffffff">33</text>
    <circle cx="190" cy="300" r="18"/><text x="190" y="304" fill="#ffffff">37</text>
    <circle cx="245" cy="300" r="18"/><text x="245" y="304" fill="#ffffff">38</text>

    <circle cx="110" cy="350" r="18"/><text x="110" y="354" fill="#ffffff">40</text>
    <circle cx="165" cy="350" r="18"/><text x="165" y="354" fill="#ffffff">04</text>
    <circle cx="220" cy="350" r="18"/><text x="220" y="354" fill="#ffffff">17</text>
  </g>
  <text x="165" y="410" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="11" font-weight="600">Cubre el 78% de combinaciones óptimas</text>

  <!-- Flechas Conectoras -->
  <path d="M 290 260 C 340 260, 340 135, 390 135" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 290 260 C 340 260, 340 200, 390 200" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <path d="M 290 260 C 340 260, 340 265, 390 265" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M 290 260 C 340 260, 340 330, 390 330" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 290 260 C 340 260, 340 395, 390 395" fill="none" stroke="#ec4899" stroke-width="2"/>

  <!-- 5 Jugadas Complementarias -->
  <g font-family="Inter, sans-serif">
    <!-- Jugada 1 -->
    <rect x="390" y="110" width="300" height="52" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="405" y="130" fill="#93c5fd" font-size="11" font-weight="700">JUGADA #1: TITULAR BALANCEADA</text>
    <text x="405" y="148" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">12 - 15 - 16 - 22 - 33 - 37</text>
    <text x="680" y="138" fill="#64748b" font-size="10" text-anchor="end">Paridad 3P-3I</text>

    <!-- Jugada 2 -->
    <rect x="390" y="175" width="300" height="52" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="405" y="195" fill="#67e8f9" font-size="11" font-weight="700">JUGADA #2: COBERTURA PARIDAD 2P-4I</text>
    <text x="405" y="213" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">09 - 11 - 14 - 22 - 33 - 37</text>
    <text x="680" y="203" fill="#64748b" font-size="10" text-anchor="end">Suma 126</text>

    <!-- Jugada 3 -->
    <rect x="390" y="240" width="300" height="52" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="405" y="260" fill="#6ee7b7" font-size="11" font-weight="700">JUGADA #3: COBERTURA PARIDAD 4P-2I</text>
    <text x="405" y="278" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">09 - 12 - 15 - 16 - 38 - 40</text>
    <text x="680" y="268" fill="#64748b" font-size="10" text-anchor="end">Suma 130</text>

    <!-- Jugada 4 -->
    <rect x="390" y="305" width="300" height="52" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="405" y="325" fill="#fcd34d" font-size="11" font-weight="700">JUGADA #4: HAZARD KDE RETORNO</text>
    <text x="405" y="343" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">09 - 15 - 16 - 25 - 37 - 38</text>
    <text x="680" y="333" fill="#64748b" font-size="10" text-anchor="end">Frec. Alta</text>

    <!-- Jugada 5 -->
    <rect x="390" y="370" width="300" height="52" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
    <text x="405" y="390" fill="#f472b6" font-size="11" font-weight="700">JUGADA #5: GRAFO DE CO-OCURRENCIA</text>
    <text x="405" y="408" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">02 - 11 - 12 - 33 - 37 - 40</text>
    <text x="680" y="398" fill="#64748b" font-size="10" text-anchor="end">Lift Max</text>
  </g>

  <!-- Impacto Cuantitativo -->
  <rect x="720" y="160" width="200" height="210" rx="12" fill="#020617" stroke="#10b981" stroke-width="2"/>
  <text x="820" y="195" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="24" font-weight="900">+400%</text>
  <text x="820" y="215" text-anchor="middle" fill="#f8fafc" font-family="Inter, sans-serif" font-size="12" font-weight="700">CAPTURA PREMIOS</text>
  <line x1="740" y1="230" x2="900" y2="230" stroke="#1e293b" stroke-width="1"/>
  <text x="820" y="255" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="13" font-weight="800">99 Ternas</text>
  <text x="820" y="285" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="13" font-weight="800">12 Cuaternas</text>
  <text x="820" y="310" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">0 Quinas (Pozo)</text>
  <text x="820" y="325" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">0 Loto (Pleno)</text>
  <text x="820" y="350" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="600">733 Sorteos Auditados</text>
</svg>